[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urim"
version = "0.1.0"
description = "Multi-agent crypto signal detection system"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "python-telegram-bot>=21.0",
    "redis>=5.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Live Solana execution. Not needed for paper trading (the default).
trade = [
    "solders>=0.21",
    "base58>=2.1",
]
# Technical-analysis signals (vendored tradingbot detectors).
ta = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["skills*", "agents*", "pipeline*", "storage*", "trading*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
